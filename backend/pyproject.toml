[project]
name = "dam-governance"
version = "0.1.0"
description = "DAM Governance Intelligence Platform — Danantara"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "minio>=7.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
seed = ["reportlab>=4.0"]   # generate realistic sample PDFs (scripts/generate_samples.py)
# OCR / document understanding (Sprint 2.10). Heavy + needs system binaries
# (Tesseract, poppler). Install only where DOC_PARSER=layered is used:
#   pip install ".[ocr]"   (image stays lean by default)
ocr = ["docling>=2.0", "pytesseract>=0.3.10", "pdf2image>=1.17", "pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
