# Port strategy
# ─────────────────────────────────────────────────────────────────────────────
# Services talk to each other INSIDE the compose network by name on their
# container ports (db:5432, minio:9000, backend:8000) — those need NO host
# ports. We publish to the host ONLY what you open from a browser/CLI:
#   3010  frontend  (browser)
#   8010  backend   (browser /api + http://localhost:8010/docs)
# db and minio stay internal-only, so they can never conflict with a local
# Postgres/MinIO. Uncomment their ports blocks only if you need psql / the
# MinIO console from the host (debug). Host ports match ./start.sh.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam_governance
    expose:
      - "5432"            # internal only — reached as db:5432
    # ports:              # uncomment for host psql access (host 55432)
    #   - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dam-admin
      MINIO_ROOT_PASSWORD: dam-secret
    expose:
      - "9000"            # internal only — reached as minio:9000
      - "9001"
    # ports:              # uncomment for host MinIO console (host 59000/59001)
    #   - "59000:9000"
    #   - "59001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DAM_MODEL: ${DAM_MODEL:-claude-opus-4-8}
      DATABASE_URL: postgresql+asyncpg://dam:dam@db:5432/dam_governance
      MINIO_ENDPOINT: minio:9000
      SOP_CONFIG_DIR: /config/sop
    volumes:
      - ./config:/config:ro
      - auditdata:/app/data/audit
    ports:
      - "8010:8000"       # host 8010 → container 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      PORT: "3010"
      VITE_API_URL: http://backend:8000   # vite proxies /api here over the internal network
    ports:
      - "3010:3010"       # host 3010 → container 3010
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  auditdata:
