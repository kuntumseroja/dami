services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam_governance
    ports:
      - "55432:5432"   # host 55432 — avoids collision with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dam-admin
      MINIO_ROOT_PASSWORD: dam-secret
    ports:
      - "59000:9000"   # host 59000 — avoids collision with a local MinIO
      - "59001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DAM_MODEL: ${DAM_MODEL:-claude-opus-4-8}
      DATABASE_URL: postgresql+asyncpg://dam:dam@db:5432/dam_governance
      MINIO_ENDPOINT: minio:9000
      SOP_CONFIG_DIR: /config/sop
    volumes:
      - ./config:/config:ro
      - auditdata:/app/data/audit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  auditdata:
