# Model registry — consumed by the LLMGateway router (Sprint 2.9) and the
# ingestion document-processing pipeline (Sprint 2.10).
#
# Strategy: every task role defines BOTH tiers —
#   managed   = online foundation API (Claude family today; Bedrock/watsonx later)
#   self_host = vLLM-class serving behind an OpenAI-compatible endpoint
#               (portable: on-prem GPU, AWS EKS/SageMaker, Databricks Model
#               Serving, watsonx)
# Tier selection is policy-driven (RTE-00x below), never hardcoded.
#
# Hard rules (model-independent):
# - The grounding gate (FR-1, 100% source traceability) applies to EVERY model.
# - Judgment sections are never generated by ANY model.
# - Every call audited with role, tier, model id + version (PRD §11.2); model
#   changes in production require documented approval.
# - Data classification (Sprint 6.1) may FORCE the self-host tier for
#   documents above the configured sensitivity level.

serving:
  managed:
    provider: anthropic            # current; Claude Platform on AWS / Bedrock / watsonx later
  self_host:
    runtime: vllm                  # OpenAI-compatible; TGI acceptable
    endpoint_env: SELF_HOST_LLM_ENDPOINT

roles:
  drafting:                        # NOTA descriptive sections (FR-1)
    managed:
      primary: claude-sonnet-4-6   # quality/cost sweet spot for formal bilingual drafting
      escalation: claude-opus-4-8  # board-bound / high-risk cases (risk-tier gated)
    self_host:
      primary: Qwen3-235B-A22B     # MoE — best self-host quality
      small_footprint_alt: Qwen3-32B

  reasoning:                       # consistency analysis, contradiction detection (FR-2)
    managed:
      primary: claude-opus-4-8     # adaptive thinking
    self_host:
      primary: DeepSeek-R1-Distill-Qwen-32B
      notes: reasoning specialist; thinking traces logged to audit, never rendered

  extraction:                      # field extraction, classification, routing explanation (FR-4)
    managed:
      primary: claude-haiku-4-5    # fast managed tier
    self_host:
      primary: Mistral-Small-3.2   # fast self-host extraction/classification

  multimodal_edge:                 # image-heavy documents; edge / air-gapped sites
    managed:
      primary: claude-opus-4-8     # vision (high-res document understanding)
    self_host:
      primary: Gemma-3-27B         # Google-aligned multimodal
      upgrade_path: Gemma-4        # adopt when approved
      notes: self_host is the ONLY tier available on edge/air-gapped sites

# Pre-LLM document processing (ingestion pipeline, before chunking).
# These convert documents to grounded structure — not chat models.
#
# OCR strategy: Docling PRIMARY (it does layout/structure AND orchestrates OCR
# for scanned pages), Tesseract as the FALLBACK OCR engine (low Docling-OCR
# confidence, or ind/eng-specific recognition), multimodal model as last resort.
# Fully local — zero external egress (edge/air-gapped compatible, RTE-005).
document_processing:
  primary:
    engine: granite-docling         # IBM Granite-Docling VLM + docling pipeline
    tier: self_host
    does: [layout, tables, reading_order, numbered_clauses, ocr]
    output: structured markdown -> semantic chunking (2.2)
  fallback_ocr:
    engine: tesseract
    tier: self_host
    languages: [ind, eng]           # Bahasa Indonesia + English traineddata
    when: Docling OCR confidence below threshold, or no text layer present
  escalation:
    role: multimodal_edge           # Gemma 3 27B / Opus vision (config.roles)
    when: still low-confidence OCR, image-heavy, or handwritten pages
    note: output still passes the FR-1 grounding gate
  routing:
    - born-digital PDF/DOCX                    -> docling (structure; no OCR needed)
    - scanned / no text layer                  -> docling OCR; if low conf -> tesseract
    - still low-conf / image-heavy / handwritten -> multimodal_edge model

routing_policies:
  - id: RTE-001
    description: Managed-tier outage or rate-limit exhaustion -> role fallback (self_host)
  - id: RTE-002
    description: Document classification above threshold -> self-host tier forced
  - id: RTE-003
    description: Every routed call logs role, tier, model, version, and policy id fired
  - id: RTE-004
    description: Any model joining a role (either tier) passes the grounding gate and
                 the 20-case regression suite (2.4) before activation
  - id: RTE-005
    description: Edge/air-gapped deployment profile pins all roles to self_host and
                 document_processing stays fully local (docling + tesseract)
