# Model registry — consumed by the LLMGateway router (Sprint 2.9).
#
# Strategy: managed primary (Claude API) with a self-hosted fallback pool,
# routed per task role. Self-host serving is vLLM-class behind an
# OpenAI-compatible endpoint so the same adapter works on-prem, AWS GPU
# (EKS/SageMaker), Databricks Model Serving, and watsonx.
#
# Hard rules (model-independent):
# - The grounding gate (FR-1, 100% source traceability) applies to EVERY model.
# - Judgment sections are never generated by ANY model.
# - Every call audited with model id + version (PRD §11.2); model changes in
#   production require documented approval.
# - Data classification (Sprint 6.1) may FORCE the self-host tier for
#   documents above the configured sensitivity level.

serving:
  managed:
    provider: anthropic        # current; Claude Platform on AWS / Bedrock later
  self_host:
    runtime: vllm              # OpenAI-compatible; TGI acceptable
    endpoint_env: SELF_HOST_LLM_ENDPOINT

roles:
  drafting:                    # NOTA descriptive sections (FR-1)
    primary:
      model: claude-opus-4-8
      tier: managed
    fallback:
      model: Qwen3-235B-A22B   # MoE — best self-host quality
      tier: self_host
      small_footprint_alt: Qwen3-32B   # GPU-constrained deployments

  reasoning:                   # consistency analysis, contradiction detection (FR-2)
    primary:
      model: claude-opus-4-8
      tier: managed
    fallback:
      model: DeepSeek-R1-Distill-Qwen-32B
      tier: self_host
      notes: reasoning specialist; thinking traces logged to audit, never rendered

  extraction:                  # field extraction, classification, routing explanation (FR-4)
    primary:
      model: claude-haiku-4-5  # fast managed tier
      tier: managed
    fallback:
      model: Mistral-Small-3.2 # fast self-host extraction/classification
      tier: self_host

  multimodal_edge:             # scanned/image-heavy documents; edge or air-gapped sites
    primary:
      model: Gemma-3-27B
      tier: self_host
      upgrade_path: Gemma-4    # adopt when approved
      notes: Google-aligned multimodal; used where managed tier is unreachable
             or document classification forbids it

routing_policies:
  - id: RTE-001
    description: Managed-tier outage or rate-limit exhaustion -> role fallback model
  - id: RTE-002
    description: Document classification above threshold -> self-host tier forced
  - id: RTE-003
    description: Every routed call logs role, tier, model, version, and policy id fired
  - id: RTE-004
    description: Fallback outputs pass the same grounding gate and eval thresholds;
                 regression suite (2.4) runs per model before activation
