# NOTA Review Panel — agent roster and governance rubric.
#
# A NOTA is a corporate-action governance memo for an SOE (asset disposal,
# acquisition, investment, leasing). After the drafting agent produces the
# descriptive draft, this panel reviews it the way a second-line governance/
# legal/risk function and an investment committee would — specialist review,
# bounded cross-examination, grounded adjudication — before a human approver
# (the four-eyes checker) signs off. The AI never decides; it surfaces
# findings with citations and a recommendation.
#
# Design is grounded in: OECD SOE Guidelines 2024, BUMN Reg PER-2/MBU/02/2023,
# the IIA Three Lines Model, the four-eyes principle, and the multi-agent
# review literature (Du 2023 debate; Zheng 2023 LLM-as-judge biases; Madaan
# 2023 Self-Refine; Bai 2022 Constitutional AI; Wynn 2025 debate failure
# modes; Anthropic multi-agent guidance). See docs/NOTA-REVIEW-PANEL.md.

# --- Governance rubric: the dimensions every NOTA is checked against ----------
# Each maps to a governance source and a default severity (overridable by DAM
# compliance officers, mirroring the consistency-checker taxonomy).
dimensions:
  - id: DIM-LEGAL
    name: Legal & regulatory compliance
    source: OECD SOE 2024; BUMN PER-2/MBU/02/2023
    default_severity: critical
  - id: DIM-AUTHORITY
    name: Delegation-of-authority / approval-threshold correctness
    source: BUMN PER-2/2023; delegation matrix
    default_severity: critical
  - id: DIM-FINANCE
    name: Financial & valuation soundness
    source: OECD materiality; IC due-diligence practice
    default_severity: critical
  - id: DIM-RISK
    name: Risk assessment & mitigation completeness
    source: OECD SOE 2024; BUMN PER-2/2023
    default_severity: major
  - id: DIM-CONFLICT
    name: Conflict-of-interest / related-party disclosure
    source: OECD RPT; BUMN PER-2/2023; business-judgment-rule record
    default_severity: critical
  - id: DIM-DISCLOSURE
    name: Completeness & disclosure / transparency
    source: OECD disclosure; IC standard-format memo
    default_severity: major
  - id: DIM-PRECEDENT
    name: Precedent & strategy consistency
    source: IC best practice (mandate / IPS alignment)
    default_severity: major
  - id: DIM-ACCURACY
    name: Factual accuracy vs. source submission (grounding)
    source: platform FR-1 hard gate
    default_severity: critical
  - id: DIM-CALC
    name: Arithmetic / statistical reconciliation (recomputed)
    source: PRD addendum 2026-06-15 (A1) — stakeholder session
    default_severity: critical

# --- Panel roles → Danantara's actual layered review governance ---------------
# Level 1 (Technical & Advisory): one AI agent per relevant Managing Director,
# each a distinct skeptical "lens" (heterogeneity is what makes debate help —
# Wynn 2025). model_role points at config/models.yaml so each lens runs on the
# right tier. The agents REVIEW and surface findings; humans DECIDE.
#
# Danantara flow:
#   Nota Dinas → MD/Technical → Risk & Investment Committees → C-Level (CIO/COO)
#   → CEO → Dewan Pengawas → President  (approval level by scale/significance)
roles:
  - id: md_investment
    title: MD Investment Agent
    danantara_role: Managing Director — Investment
    dimensions: [DIM-FINANCE, DIM-PRECEDENT]
    reviews: Commercial feasibility, IRR/NPV, fit to national investment roadmap, BUMN fundamentals
    model_role: reasoning
    stance: skeptical
  - id: md_risk
    title: MD Risk & Sustainability Agent
    danantara_role: Managing Director — Risk & Sustainability
    dimensions: [DIM-RISK]
    reviews: Deal/geopolitical/macro/liquidity risk profile + ESG compliance
    model_role: reasoning
    stance: skeptical
  - id: md_legal
    title: MD Legal & Compliance Agent
    danantara_role: Managing Director — Legal & Compliance
    dimensions: [DIM-LEGAL, DIM-AUTHORITY, DIM-CONFLICT]
    reviews: Transaction legality, restructuring, UU PT/BUMN compliance, contract drafts
    model_role: reasoning
    stance: skeptical
  - id: md_finance
    title: MD Finance Agent
    danantara_role: Managing Director — Finance
    dimensions: [DIM-FINANCE, DIM-DISCLOSURE]
    reviews: Funding structure, cash-flow adequacy, consolidation impact, capital allocation
    model_role: reasoning
    stance: skeptical
  - id: financial_reconciliation
    title: Financial & Statistical Reconciliation Agent
    danantara_role: supports MD Finance
    dimensions: [DIM-CALC]
    reviews: Recompute %/totals/ratios — catch "13% vs 130%" (PRD addendum A1)
    model_role: extraction          # LLM locates the figures...
    stance: literal
    compute: deterministic_tool     # ...a calculator/code-exec tool recomputes — never LLM mental math
  - id: accuracy_verifier
    title: Accuracy Verifier
    dimensions: [DIM-ACCURACY]
    model_role: extraction           # fast, deterministic source-checking
    stance: literal                  # every claim must resolve to a source span

# --- Danantara review levels (what each stage maps to) -----------------------
# The AI panel accelerates Levels 1-3 (review); approval levels are HUMAN
# decisions, gated by the delegation-of-authority rule engine (config/sop).
levels:
  - level: 1
    name: Technical & Advisory Review
    who: MD agents (Investment, Risk & Sustainability, Legal & Compliance, Finance)
    panel_stage: independent_review
  - level: 2
    name: Committee Evaluation
    who: Investment Committee + Risk Committee (cross-functional, chaired by Chief Officers)
    panel_stage: cross_examination     # holistic portfolio view; reconcile risk mitigation vs return
  - level: 3
    name: Executive Endorsement
    who: CIO (long-term value creation) + COO (operational integration / execution readiness)
    panel_stage: adjudication          # the Chair synthesises into a recommendation
  - level: approval
    name: Final Decision (HUMAN — AI never decides)
    who_by_scale:
      - ceo: Routine / mid-scale within RKAP, tactical capital-market action
      - dewan_pengawas: Super-strategic — large divestiture, cross-cluster M&A, global debt
      - president: Massive fiscal impact / changes state majority ownership / PSN
    gated_by: config/sop/routing-rules.yaml (APR-002 ceo · APR-003 dewan_pengawas · APR-004 president)

# --- Adjudicator (LLM-as-judge with bias controls) ---------------------------
adjudicator:
  id: chair
  title: Review Chair (synthesises Level 3 endorsement)
  model_role: reasoning
  # Mitigations for Zheng 2023 judge biases:
  controls:
    - randomize_finding_order        # cancel position bias
    - ignore_length                  # cancel verbosity bias
    - cross_family_judge             # chair from a different model family than reviewers (self-enhancement)
    - require_citation_per_finding   # no finding survives without a source span (accuracy gate)
    - confidence_hidden_until_scored # avoid confidence cascades (Wynn 2025)

# --- Debate / flow policies --------------------------------------------------
flow:
  rounds:
    - independent_review             # each reviewer scores its dimensions blind to the others
    - cross_examination             # reviewers see peers' findings ONCE and may challenge/concede with reasons
    - adjudication                  # chair deduplicates, resolves disagreement, scores severity, recommends
  policies:
    - id: RVW-001
      desc: Heterogeneous lenses + explicit skeptical stance — debate must surface dissent, not consensus (Wynn 2025)
    - id: RVW-002
      desc: One cross-examination round only — bounded to control cost (~15x token caution, Anthropic) and conformity drift
    - id: RVW-003
      desc: Every finding cites a resolvable source span or a fired rule id; uncited findings are dropped (FR-1 gate)
    - id: RVW-004
      desc: Deterministic dimensions (DIM-AUTHORITY thresholds) decided by the rule engine, not the panel — AI explains only
    - id: RVW-005
      desc: Panel depth gated by risk tier — low-risk skips cross-examination; high-risk runs full panel + dissent log
    - id: RVW-006
      desc: AI never approves; output is a recommendation + findings for the human four-eyes checker; full debate audited
    - id: RVW-007
      desc: Arithmetic (DIM-CALC) is recomputed by a deterministic calculator/code-exec tool, never by LLM mental math; findings cite source numbers + recomputed value (PRD addendum A1)
    - id: RVW-008
      desc: Chair report includes an explicit confidence score + unresolved-issues / needs-human-review block (PRD addendum A6)
