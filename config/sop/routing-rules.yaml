# Digitized SOP decision rules for DAM request routing.
#
# This file IS the codified rulebook (requirement F: "codify rules into
# system"). Rules are evaluated top-down; the first match per field wins.
# Every fired rule id is recorded in the audit trail, so routing outcomes are
# deterministic and legally reconstructable — no individual judgment required
# for low-risk flows.

sops:
  - id: SOP-DAM-001
    name: Asset Disposal — Standard
    applies_when:
      request_type: asset_disposal
  - id: SOP-DAM-002
    name: Asset Acquisition & Investment
    applies_when:
      request_type: [asset_acquisition, investment]
  - id: SOP-DAM-003
    name: Asset Utilization / Leasing
    applies_when:
      request_type: [asset_lease, asset_utilization]
  - id: SOP-DAM-004
    name: Capital Markets & Debt Issuance
    applies_when:
      request_type: debt_issuance
  - id: SOP-DAM-005
    name: Merger, Acquisition & Corporate Restructuring
    applies_when:
      request_type: merger_acquisition
  - id: SOP-DAM-006
    name: Capital Expenditure / Project Investment
    applies_when:
      request_type: capital_expenditure
  - id: SOP-DAM-007
    name: Asset Write-off / Impaired Asset Disposal
    applies_when:
      request_type: asset_writeoff
  - id: SOP-DAM-999
    name: General Governance Request (fallback)
    applies_when: {}

# Delegation of authority — amount thresholds in IDR.
approval_rules:
  - id: APR-001
    description: Below 1B IDR — no board approval required
    max_amount_idr: 1_000_000_000
    approval_required: false
    approval_level: null
  - id: APR-002
    description: Routine / mid-scale corporate action within RKAP — CEO Danantara
    max_amount_idr: 500_000_000_000
    approval_required: true
    approval_level: ceo                 # Level Persetujuan 1 — CEO Danantara
  - id: APR-003
    description: Super-strategic (large divestiture, cross-cluster M&A, global debt) — Dewan Pengawas
    max_amount_idr: 5_000_000_000_000
    approval_required: true
    approval_level: dewan_pengawas      # Level Persetujuan 2 — Dewan Pengawas (collective)
  - id: APR-004
    description: Massive fiscal impact / changes state majority ownership / PSN — President RI
    max_amount_idr: null
    approval_required: true
    approval_level: president           # Level Persetujuan 3 — Presiden RI

# Risk segmentation — drives automation level (requirement 8).
risk_rules:
  - id: RSK-001
    description: Routine low-value requests are fully automated
    max_amount_idr: 1_000_000_000
    request_types: [asset_lease, asset_utilization]
    tier: low
  - id: RSK-002
    description: Mid-value or disposal requests get human sign-off checkpoints
    max_amount_idr: 50_000_000_000
    request_types: null   # any
    tier: medium
  - id: RSK-003
    description: High-value or strategic requests are human-in-the-loop throughout
    max_amount_idr: null
    request_types: null
    tier: high
